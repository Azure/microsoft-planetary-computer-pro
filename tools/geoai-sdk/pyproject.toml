[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-sdk"
version = "0.1.0"
description = "Python SDK for running geospatial AI models on Azure AI Foundry and Planetary Computer Pro"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Microsoft Azure Orbital Spatio Team"}
]
keywords = ["geospatial", "ai", "azure", "stac", "object-detection", "weather-forecasting", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "azure-identity>=1.13.0",
    "azure-storage-blob>=12.19.0",
    "azure-storage-queue>=12.8.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "pystac>=1.8.0",
    "pystac-client>=0.7.0",
    "planetary-computer>=1.0.0",
    "tqdm>=4.66.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.1.0",
]
examples = [
    "ipykernel>=6.25.0",
    "notebook>=7.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://aka.ms/geoaisdk"
Documentation = "https://github.com/Azure/microsoft-planetary-computer-pro/tree/main/docs/geoai"
Repository = "https://github.com/Azure/microsoft-planetary-computer-pro/tree/main/tools/geoai-sdk"
Issues = "https://github.com/Azure/microsoft-planetary-computer-pro/issues"

[tool.setuptools.packages.find]
include = ["geoai*"]
exclude = ["geoai.tests*"]

[tool.setuptools.package-data]
geoai = ["specs/*.json", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["geoai/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
